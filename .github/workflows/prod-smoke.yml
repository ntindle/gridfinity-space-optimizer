name: Production smoke check

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: URL to check
        default: https://gridfinitylayout.com/

permissions:
  contents: read

concurrency:
  group: prod-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_URL: ${{ github.event.inputs.url || 'https://gridfinitylayout.com/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Wait until production serves this commit's build
        if: github.event_name == 'push'
        run: |
          npm run build
          entry=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          echo "Waiting for $entry on $SMOKE_URL"
          for i in $(seq 1 60); do
            if curl -fsS "$SMOKE_URL" | grep -q "$entry"; then echo "Live after $((i*10))s"; exit 0; fi
            sleep 10
          done
          echo "::error::Production did not serve $entry within 10 minutes. Netlify deploy may have failed."
          exit 1
      - id: smoke
        run: node scripts/smoke.mjs "$SMOKE_URL"
      - name: Roll back to the previous Netlify deploy
        if: failure() && steps.smoke.outcome == 'failure' && github.event_name == 'push'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Smoke failed and NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID are not set, so no rollback ran."
            exit 1
          fi
          api=https://api.netlify.com/api/v1
          auth="Authorization: Bearer $NETLIFY_AUTH_TOKEN"
          current=$(curl -fsS -H "$auth" "$api/sites/$NETLIFY_SITE_ID" | jq -r '.published_deploy.id')
          previous=$(curl -fsS -H "$auth" "$api/sites/$NETLIFY_SITE_ID/deploys?production=true&state=ready&per_page=10" \
            | jq -r --arg cur "$current" '[.[] | select(.id != $cur)][0].id')
          if [ -z "$previous" ] || [ "$previous" = "null" ]; then
            echo "::error::No previous ready production deploy to restore."
            exit 1
          fi
          curl -fsS -X POST -H "$auth" "$api/sites/$NETLIFY_SITE_ID/deploys/$previous/restore" > /dev/null
          echo "::warning::Restored Netlify deploy $previous after smoke failure on $current. Open a revert PR for ${{ github.sha }}."
